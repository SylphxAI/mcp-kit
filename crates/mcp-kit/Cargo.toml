[package]
name = "sylphx-mcp-kit"
description = "Shared parts of Sylphx MCP servers: a stdio MCP server on rmcp, workspace roots, and `setup` for MCP clients."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
rust-version = "1.88"
keywords = ["mcp", "model-context-protocol", "rmcp", "cli"]
categories = ["development-tools"]

[lib]
name = "mcp_kit"

[dependencies]
anyhow = "1"
dirs = "6"
rmcp = { version = "3.4", default-features = false, features = ["server", "transport-io"], optional = true }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "io-std"], optional = true }
toml_edit = { version = "0.23", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
sha2 = { version = "0.10", optional = true }
unicode-normalization = { version = "0.1", optional = true }
ureq = { version = "3", optional = true }

[features]
default = ["server", "setup"]
# The stdio MCP server on rmcp (`mcp_kit::server`).
server = ["dep:rmcp", "dep:tokio"]
# Registering the server with MCP clients (`mcp_kit::setup`).
setup = ["dep:toml_edit"]
# Local embeddings with a static model2vec model (`mcp_kit::embed`).
embed = ["dep:serde", "dep:sha2", "dep:unicode-normalization", "dep:ureq"]

[dev-dependencies]
rmcp = { version = "3.4", default-features = false, features = ["server", "client", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "io-std", "io-util", "macros"] }

[[test]]
name = "server"
required-features = ["server"]
