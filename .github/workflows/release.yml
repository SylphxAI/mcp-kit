name: release (reusable)

# Publishes an MCP server built with mcp-kit when its npm version is new:
# native binaries (5 targets) -> npm (trusted publishing, OIDC) -> npx smoke
# -> GitHub release -> MCP Registry, plus optional GHCR image and retiring
# old registry names. No long-lived tokens.
#
# Caller (e.g. .github/workflows/release.yml):
#   on: { push: { branches: [main] }, workflow_dispatch: {} }
#   jobs:
#     release:
#       uses: SylphxAI/mcp-kit/.github/workflows/release.yml@v0
#       permissions: { contents: write, id-token: write, packages: write }
#       with: { name: repomap, npm-package: '@sylphx/repomap', mcp-name: io.github.SylphxAI/repomap }
#
# npm trusted publishing matches the CALLER's workflow file, so each npm
# package trusts <owner>/<repo> + .github/workflows/release.yml.
#
# With `mcpb: true` the GitHub release also carries MCP Bundles for one-click
# install in Claude Desktop and other MCPB hosts: <name>-<version>.mcpb (every
# platform) and <name>-<version>-<platform>.mcpb (one binary each).

on:
  workflow_call:
    inputs:
      name:
        description: 'Binary name (also the cargo package unless cargo-package is set).'
        type: string
        required: true
      npm-package:
        description: 'Main npm package, e.g. @sylphx/repomap.'
        type: string
        required: true
      mcp-name:
        description: 'MCP Registry name, e.g. io.github.SylphxAI/repomap (server.json at the repo root).'
        type: string
        required: true
      cargo-package:
        type: string
        default: ''
      package-dir:
        description: 'Directory of the main npm package. Default packages/<name>.'
        type: string
        default: ''
      natives-dir:
        description: 'Directory holding one npm package per platform (darwin-arm64, …).'
        type: string
        default: packages/npm
      alias-dirs:
        description: 'Space-separated npm alias package directories published after the main package.'
        type: string
        default: ''
      smoke:
        description: 'Shell run after publishing, with $V set; default `npx -y <npm-package>@$V version`.'
        type: string
        default: ''
      docker-image:
        description: 'Optional GHCR image (e.g. ghcr.io/sylphxai/repomap), built from Dockerfile.release.'
        type: string
        default: ''
      retired-mcp-names:
        description: 'Space-separated MCP Registry names to mark deprecated.'
        type: string
        default: ''
      retired-message:
        type: string
        default: ''
      major-tag:
        description: 'Move the vN tag to each release (for `uses: owner/repo@vN` actions).'
        type: boolean
        default: false
      mcpb:
        description: 'Attach MCP Bundles (.mcpb) to the GitHub release. An optional mcpb.json at the repo root is merged into each manifest.'
        type: boolean
        default: false
      mcpb-icon:
        description: 'PNG icon for the bundles (512×512), e.g. docs/public/icon.png.'
        type: string
        default: ''
      kit-ref:
        description: 'mcp-kit ref for release helpers and MCP Bundles; pin with the reusable workflow.'
        type: string
        default: v0

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      canonical: ${{ steps.v.outputs.canonical }}
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      cargo: ${{ steps.v.outputs.cargo }}
      dir: ${{ steps.v.outputs.dir }}
      npm-missing: ${{ steps.v.outputs.npm-missing }}
      github-missing: ${{ steps.v.outputs.github-missing }}
      registry-missing: ${{ steps.v.outputs.registry-missing }}
      docker-missing: ${{ steps.v.outputs.docker-missing }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SylphxAI/mcp-kit
          ref: ${{ inputs.kit-ref }}
          path: .mcp-kit
          sparse-checkout: scripts
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ inputs.name }}
          PKG: ${{ inputs.npm-package }}
          DIR: ${{ inputs.package-dir }}
          CARGO: ${{ inputs.cargo-package }}
          NATIVES: ${{ inputs.natives-dir }}
          ALIASES: ${{ inputs.alias-dirs }}
          MCP_NAME: ${{ inputs.mcp-name }}
          IMAGE: ${{ inputs.docker-image }}
          MCPB: ${{ inputs.mcpb }}
        run: node .mcp-kit/scripts/release.mjs plan

  build:
    needs: check
    if: needs.check.outputs.publish == 'true'
    name: build ${{ matrix.key }}
    env:
      CANONICAL_SHA: ${{ needs.check.outputs.canonical }}
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ inputs.name }}
      PKG: ${{ inputs.npm-package }}
      DIR: ${{ inputs.package-dir }}
      CARGO: ${{ inputs.cargo-package }}
      NATIVES: ${{ inputs.natives-dir }}
      ALIASES: ${{ inputs.alias-dirs }}
      MCP_NAME: ${{ inputs.mcp-name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        include:
          - { key: darwin-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { key: darwin-x64, os: macos-latest, target: x86_64-apple-darwin }
          - { key: linux-x64-gnu, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, zig: '2.17' }
          - { key: linux-arm64-gnu, os: ubuntu-latest, target: aarch64-unknown-linux-gnu, zig: '2.17' }
          - { key: win32-x64-msvc, os: windows-latest, target: x86_64-pc-windows-msvc, exe: '.exe' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SylphxAI/mcp-kit
          ref: ${{ inputs.kit-ref }}
          path: .mcp-kit
          sparse-checkout: scripts
      - id: recovery
        shell: bash
        run: node .mcp-kit/scripts/release.mjs recover "${{ matrix.key }}"
      - if: steps.recovery.outputs.recovered != 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - if: steps.recovery.outputs.recovered != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - if: matrix.zig && steps.recovery.outputs.recovered != 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.14.1
      - if: matrix.zig && steps.recovery.outputs.recovered != 'true'
        run: cargo install cargo-zigbuild --version 0.23.0 --locked
      - name: Build missing native
        if: steps.recovery.outputs.recovered != 'true'
        shell: bash
        env:
          CARGO_PKG: ${{ needs.check.outputs.cargo }}
          BIN: ${{ inputs.name }}${{ matrix.exe }}
        run: |
          set -euo pipefail
          node .mcp-kit/scripts/release.mjs cargo
          if [ -n "${{ matrix.zig }}" ]; then
            cargo zigbuild --release --locked -p "$CARGO_PKG" --target ${{ matrix.target }}.${{ matrix.zig }}
          else
            cargo build --release --locked -p "$CARGO_PKG" --target ${{ matrix.target }}
          fi
          mkdir -p out
          cp "target/${{ matrix.target }}/release/$BIN" out/
          actual_source=$(git rev-parse HEAD)
          test "$actual_source" = "$CANONICAL_SHA"
          node .mcp-kit/scripts/release.mjs identity "${{ matrix.key }}"
      - name: Run it (native targets)
        if: matrix.key != 'linux-arm64-gnu' && matrix.key != 'darwin-x64'
        shell: bash
        run: node .mcp-kit/scripts/release.mjs version "./out/${{ inputs.name }}${{ matrix.exe }}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.key }}
          path: out/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      CANONICAL_SHA: ${{ needs.check.outputs.canonical }}
      GH_TOKEN: ${{ github.token }}
      MCP_NAME: ${{ inputs.mcp-name }}
      V: ${{ needs.check.outputs.version }}
      NAME: ${{ inputs.name }}
      PKG: ${{ inputs.npm-package }}
      DIR: ${{ needs.check.outputs.dir }}
      NATIVES: ${{ inputs.natives-dir }}
      ALIASES: ${{ inputs.alias-dirs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SylphxAI/mcp-kit
          ref: ${{ inputs.kit-ref }}
          path: .mcp-kit
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Trusted publishing (OIDC) needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1
      # Only the binaries: a re-run also sees other artifacts of the run,
      # such as the Docker build record.
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts
      - name: Stage natives
        run: |
          set -euo pipefail
          node .mcp-kit/scripts/release.mjs stage
          cp README.md LICENSE "$DIR/"
      - name: Publish missing npm packages (trusted publishing)
        if: needs.check.outputs.npm-missing == 'true'
        run: |
          set -euo pipefail
          pub() {
            local dir=$1 name
            name=$(node -p "require('./$dir/package.json').name")
            present=$(node .mcp-kit/scripts/release.mjs probe npm "$name" "$V")
            if [ "$present" = true ]; then echo "= $name@$V already live"; return; fi
            (cd "$dir" && npm publish --access public)
            echo "+ $name@$V"
          }
          for d in "$NATIVES"/*/; do pub "${d%/}"; done
          pub "$DIR"
          for a in $ALIASES; do pub "$a"; done
          # The registry can take minutes to serve new versions; wait once for all.
          for d in "$NATIVES"/*/ "$DIR" $ALIASES; do
            name=$(node -p "require('./${d%/}/package.json').name")
            node .mcp-kit/scripts/release.mjs wait npm "$name" "$V"
          done
      - name: Smoke the published package
        env:
          SMOKE: ${{ inputs.smoke }}
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          actual=$(npx -y "$PKG@$V" version)
          test "$actual" = "$NAME $V"
          if [ -n "$SMOKE" ]; then bash -euo pipefail -c "$SMOKE"; else npx -y "$PKG@$V" version; fi
      - name: MCP Bundles
        if: inputs.mcpb && needs.check.outputs.github-missing == 'true'
        env:
          ICON: ${{ inputs.mcpb-icon }}
        run: |
          set -euo pipefail
          node .mcp-kit/scripts/mcpb.mjs --name "$NAME" --version "$V" --natives "$NATIVES" \
            --package-dir "$DIR" --out assets ${ICON:+--icon "$ICON"} \
            --tools-from "$NATIVES/linux-x64-gnu/$NAME"
          ls -la assets
      - name: Complete the GitHub release
        if: needs.check.outputs.github-missing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          present=$(node .mcp-kit/scripts/release.mjs probe github "$GITHUB_REPOSITORY" "$V")
          mkdir -p assets
          for d in "$NATIVES"/*/; do
            key=$(basename "$d")
            cp "artifacts/native-$key/identity.json" "assets/$NAME-$key.identity.json"
            if [ -f "$d$NAME.exe" ]; then (cd "$d" && zip -q "$GITHUB_WORKSPACE/assets/$NAME-$key.zip" "$NAME.exe")
            else tar -C "$d" -czf "assets/$NAME-$key.tar.gz" "$NAME"; fi
          done
          notes=$(awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md 2>/dev/null || true)
          if [ "$present" = false ]; then
            gh release create "v$V" assets/* --target "$CANONICAL_SHA" --title "$NAME $V" --notes "${notes:-$NAME $V}"
          else
            # Keep delivered assets immutable; fill only the missing ones.
            node .mcp-kit/scripts/release.mjs assets assets/* > missing-assets
            while IFS= read -r asset; do gh release upload "v$V" "$asset"; done < missing-assets
          fi
      - name: Move the major tag
        if: inputs.major-tag
        run: |
          set -euo pipefail
          git tag -f "v${V%%.*}" "$CANONICAL_SHA"
          git push -f origin "refs/tags/v${V%%.*}"
      - name: Complete the MCP Registry entry
        if: needs.check.outputs.registry-missing == 'true'
        env:
          MCP_NAME: ${{ inputs.mcp-name }}
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          present=$(node .mcp-kit/scripts/release.mjs probe registry "$MCP_NAME" "$V")
          if [ "$present" = false ]; then ./mcp-publisher publish; fi
          node .mcp-kit/scripts/release.mjs wait registry "$MCP_NAME" "$V"

  docker:
    needs: [check, build]
    if: inputs.docker-image != '' && needs.check.outputs.docker-missing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      CANONICAL_SHA: ${{ needs.check.outputs.canonical }}
      GH_TOKEN: ${{ github.token }}
      MCP_NAME: ${{ inputs.mcp-name }}
      V: ${{ needs.check.outputs.version }}
      NAME: ${{ inputs.name }}
      IMAGE: ${{ inputs.docker-image }}
      PKG: ${{ inputs.npm-package }}
      DIR: ${{ inputs.package-dir }}
      NATIVES: ${{ inputs.natives-dir }}
      ALIASES: ${{ inputs.alias-dirs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SylphxAI/mcp-kit
          ref: ${{ inputs.kit-ref }}
          path: .mcp-kit
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: native-linux-*
          path: artifacts
      - name: Stage prebuilt linux binaries
        run: |
          set -euo pipefail
          node .mcp-kit/scripts/release.mjs stage linux-x64-gnu linux-arm64-gnu
          mkdir -p dist/amd64 dist/arm64
          cp "artifacts/native-linux-x64-gnu/$NAME" dist/amd64/
          cp "artifacts/native-linux-arm64-gnu/$NAME" dist/arm64/
          chmod +x dist/*/"$NAME"
      - id: identity
        run: |
          echo "amd64=$(node -p "require('./artifacts/native-linux-x64-gnu/identity.json').sha256")" >> "$GITHUB_OUTPUT"
          echo "arm64=$(node -p "require('./artifacts/native-linux-arm64-gnu/identity.json').sha256")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.V }},${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ env.V }}
            org.opencontainers.image.revision=${{ needs.check.outputs.canonical }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.sylphx.native.linux-x64-gnu.sha256=${{ steps.identity.outputs.amd64 }}
            io.sylphx.native.linux-arm64-gnu.sha256=${{ steps.identity.outputs.arm64 }}
      - name: Read back the image
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE:$V"
          actual=$(docker run --rm --entrypoint "$NAME" "$IMAGE:$V" version)
          test "$actual" = "$NAME $V"
          node .mcp-kit/scripts/release.mjs require image "$IMAGE" "$V"

  registry-retired:
    needs: [check, build, publish]
    # A complete no-op release skips publish. Still verify the replacement;
    # failure/cancellation must never deprecate its predecessors.
    if: ${{ !cancelled() && inputs.retired-mcp-names != '' && needs.check.result == 'success' && (needs.publish.result == 'success' || (needs.check.outputs.publish == 'false' && needs.build.result == 'skipped' && needs.publish.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SylphxAI/mcp-kit
          ref: ${{ inputs.kit-ref }}
          path: .mcp-kit
          sparse-checkout: scripts
      - name: Deprecate retired MCP Registry names
        env:
          MCP_NAME: ${{ inputs.mcp-name }}
          V: ${{ needs.check.outputs.version }}
          RETIRED: ${{ inputs.retired-mcp-names }}
          MESSAGE: ${{ inputs.retired-message }}
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          node .mcp-kit/scripts/release.mjs require registry "$MCP_NAME" "$V"
          for retired in $RETIRED; do
            deprecated=$(node .mcp-kit/scripts/release.mjs deprecated "$retired")
            if [ "$deprecated" = true ]; then echo "$retired already deprecated"; continue; fi
            ok=false
            for attempt in 1 2 3 4 5; do
              # --yes skips the bulk-operation prompt (no stdin in CI).
              if out=$(./mcp-publisher status --status deprecated --all-versions --yes --message "$MESSAGE" "$retired" 2>&1) \
                 || grep -qE 'already set to the provided values|No changes to apply' <<<"$out"; then ok=true; break; fi
              echo "attempt $attempt: $out"; sleep $((attempt * 15))
            done
            [ "$ok" = true ] || { echo "::error::could not deprecate $retired"; exit 1; }
            for i in $(seq 1 24); do
              echo "checking retired status ($i/24)"
              deprecated=$(node .mcp-kit/scripts/release.mjs deprecated "$retired")
              if [ "$deprecated" = true ]; then break; fi
              sleep 5
            done
            [ "$deprecated" = true ] || { echo "::error::$retired is still not shown as deprecated"; exit 1; }
          done
