name: release (reusable)

# Publishes an MCP server built with mcp-kit when its npm version is new:
# native binaries (5 targets) -> npm (trusted publishing, OIDC) -> npx smoke
# -> GitHub release -> MCP Registry, plus optional GHCR image and retiring
# old registry names. No long-lived tokens.
#
# Every job runs on our own Linux runners (`runner`), and the macOS and
# Windows binaries are cross-compiled there. The one exception is the `npm`
# job on `publish-runner`: npm trusted publishing and provenance accept only
# GitHub-hosted runners, so that job only downloads the built binaries and
# runs `npm publish` (owner decision, standards/dx.md). `build-only: true`
# builds and checks the binaries (and the image) and publishes nothing.
#
# Caller (e.g. .github/workflows/release.yml):
#   on: { push: { branches: [main] }, workflow_dispatch: {} }
#   jobs:
#     release:
#       uses: SylphxAI/mcp-kit/.github/workflows/release.yml@v0
#       permissions: { contents: write, id-token: write, packages: write }
#       with: { name: repomap, npm-package: '@sylphx/repomap', mcp-name: io.github.SylphxAI/repomap }
#
# npm trusted publishing matches the CALLER's workflow file, so each npm
# package trusts <owner>/<repo> + .github/workflows/release.yml.
#
# With `mcpb: true` the GitHub release also carries MCP Bundles for one-click
# install in Claude Desktop and other MCPB hosts: <name>-<version>.mcpb (every
# platform) and <name>-<version>-<platform>.mcpb (one binary each).

on:
  workflow_call:
    inputs:
      name:
        description: 'Binary name (also the cargo package unless cargo-package is set).'
        type: string
        required: true
      npm-package:
        description: 'Main npm package, e.g. @sylphx/repomap.'
        type: string
        required: true
      mcp-name:
        description: 'MCP Registry name, e.g. io.github.SylphxAI/repomap (server.json at the repo root).'
        type: string
        required: true
      cargo-package:
        type: string
        default: ''
      package-dir:
        description: 'Directory of the main npm package. Default packages/<name>.'
        type: string
        default: ''
      natives-dir:
        description: 'Directory holding one npm package per platform (darwin-arm64, …).'
        type: string
        default: packages/npm
      alias-dirs:
        description: 'Space-separated npm alias package directories published after the main package.'
        type: string
        default: ''
      smoke:
        description: 'Shell run after publishing, with $V set; default `npx -y <npm-package>@$V version`.'
        type: string
        default: ''
      docker-image:
        description: 'Optional GHCR image (e.g. ghcr.io/sylphxai/repomap), built from Dockerfile.release.'
        type: string
        default: ''
      retired-mcp-names:
        description: 'Space-separated MCP Registry names to mark deprecated.'
        type: string
        default: ''
      retired-message:
        type: string
        default: ''
      major-tag:
        description: 'Move the vN tag to each release (for `uses: owner/repo@vN` actions).'
        type: boolean
        default: false
      mcpb:
        description: 'Attach MCP Bundles (.mcpb) to the GitHub release. An optional mcpb.json at the repo root is merged into each manifest.'
        type: boolean
        default: false
      mcpb-icon:
        description: 'PNG icon for the bundles (512×512), e.g. docs/public/icon.png.'
        type: string
        default: ''
      kit-ref:
        description: 'mcp-kit ref to take scripts/mcpb.mjs from.'
        type: string
        default: v0
      runner:
        description: 'Runner for every job except the npm publish.'
        type: string
        default: sylphx-linux-standard
      publish-runner:
        description: 'Runner for the npm publish job only; trusted publishing needs a GitHub-hosted one.'
        type: string
        default: ubuntu-latest
      build-only:
        description: 'Build and check the binaries (and the image), publish nothing.'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      cargo: ${{ steps.v.outputs.cargo }}
      dir: ${{ steps.v.outputs.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ inputs.name }}
          PKG: ${{ inputs.npm-package }}
          DIR: ${{ inputs.package-dir }}
          CARGO: ${{ inputs.cargo-package }}
          NATIVES: ${{ inputs.natives-dir }}
          ALIASES: ${{ inputs.alias-dirs }}
        run: |
          set -euo pipefail
          DIR=${DIR:-packages/$NAME}
          V=$(node -p "require('./$DIR/package.json').version")
          # Every manifest carries the same version.
          node -e '
            const fs = require("fs"), [v, natives, ...aliases] = process.argv.slice(1);
            const bad = [];
            const eq = (what, got) => got !== v && bad.push(`${what}: ${got}`);
            for (const d of fs.readdirSync(natives)) eq(`${natives}/${d}`, require(`./${natives}/${d}/package.json`).version);
            for (const d of aliases.filter(Boolean)) eq(d, require(`./${d}/package.json`).version);
            if (fs.existsSync("server.json")) { const s = require("./server.json"); eq("server.json", s.version); eq("server.json package", s.packages[0].version); }
            if (bad.length) { console.error(`version mismatch (want ${v}):\n  ${bad.join("\n  ")}`); process.exit(1); }
          ' "$V" "$NATIVES" $ALIASES
          {
            echo "version=$V"
            echo "dir=$DIR"
            echo "cargo=${CARGO:-$NAME}"
            # New on npm, or on npm without its GitHub release yet (a run that
            # stopped after publishing): the steps that already ran are skipped.
            if ! npm view "$PKG@$V" version >/dev/null 2>&1 || ! gh release view "v$V" >/dev/null 2>&1; then
              echo "publish=true"
            else
              echo "publish=false"
            fi
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.publish == 'true' || inputs.build-only
    name: build ${{ matrix.key }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        # All on Linux: zig links the gnu (glibc 2.17) and Apple targets, with
        # a versioned zig target keeping Rust's macOS floor (`min`);
        # cargo-xwin links MSVC. `file` is what `file` must print.
        include:
          - { key: darwin-arm64, target: aarch64-apple-darwin, zig: aarch64-macos.11.0-none, min: '11.0', file: 'Mach-O 64-bit arm64 executable' }
          - { key: darwin-x64, target: x86_64-apple-darwin, zig: x86_64-macos.10.12-none, min: '10.12', file: 'Mach-O 64-bit x86_64 executable' }
          - { key: linux-x64-gnu, target: x86_64-unknown-linux-gnu, file: 'ELF 64-bit LSB .*x86-64' }
          - { key: linux-arm64-gnu, target: aarch64-unknown-linux-gnu, file: 'ELF 64-bit LSB .*ARM aarch64' }
          - { key: win32-x64-msvc, target: x86_64-pc-windows-msvc, exe: '.exe', file: 'PE32\+ executable \(console\) x86-64' }
    env:
      T: ${{ matrix.target }}
      CARGO_PKG: ${{ needs.check.outputs.cargo }}
      BIN: ${{ inputs.name }}${{ matrix.exe }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
          # llvm-objdump for the checks; llvm-ar is cargo-xwin's llvm-lib.
          components: llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      # cargo-xwin's MSVC CRT and Windows SDK: minutes to download.
      - if: ${{ matrix.exe }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-0.23.1-x86_64
      - if: ${{ !matrix.exe }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Cross tools
        run: |
          set -euo pipefail
          fetch() { curl -fsSL -o "$RUNNER_TEMP/$2" "$1"; echo "$3  $RUNNER_TEMP/$2" | sha256sum -c -; }
          mkdir -p "$RUNNER_TEMP/bin" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          case "$T" in
            *-windows-msvc)
              fetch https://github.com/rust-cross/cargo-xwin/releases/download/v0.23.1/cargo-xwin-v0.23.1.x86_64-unknown-linux-musl.tar.gz xwin.tgz \
                c492c6dfb7e5ac0eee586b796e0fc950ba13077e7f0bbb046f445d71790d5360
              tar -xzf "$RUNNER_TEMP/xwin.tgz" -C "$RUNNER_TEMP/bin" cargo-xwin
              # wine runs the .exe below. Ubuntu 24.04's wine 9.0 aborts in our
              # runner VMs; this 64-bit-only build runs without i386 libraries.
              fetch https://github.com/Kron4ek/Wine-Builds/releases/download/11.18/wine-11.18-amd64-wow64.tar.xz wine.txz \
                f899879b8c37e0b20adca19d147cf77436f3f1a37bf16d08d27fa7137a52b9ba
              tar -xJf "$RUNNER_TEMP/wine.txz" -C "$RUNNER_TEMP"
              echo "$RUNNER_TEMP/wine-11.18-amd64-wow64/bin" >> "$GITHUB_PATH"
              # clang is cargo-xwin's clang-cl.
              sudo apt-get update -qq
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends clang >/dev/null ;;
            *)
              fetch https://github.com/rust-cross/cargo-zigbuild/releases/download/v0.23.4/cargo-zigbuild-x86_64-unknown-linux-gnu.tar.xz zigbuild.txz \
                6b69963040818ca1ef573d8135a95aa902e17cf7f873c32c6426642dadfe7f59
              tar -xJf "$RUNNER_TEMP/zigbuild.txz" -C "$RUNNER_TEMP/bin" --strip-components 1 cargo-zigbuild-x86_64-unknown-linux-gnu/cargo-zigbuild ;;
          esac
          case "$T" in
            *-apple-darwin)
              fetch https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz sdk.txz \
                cd4f08a75577145b8f05245a2975f7c81401d75e9535dcffbb879ee1deefcbf4
              tar -xJf "$RUNNER_TEMP/sdk.txz" -C "$RUNNER_TEMP"
              echo "SDKROOT=$RUNNER_TEMP/MacOSX11.3.sdk" >> "$GITHUB_ENV" ;;
          esac
      - name: Build
        env:
          ZIG_TARGET: ${{ matrix.zig }}
          XWIN_ACCEPT_LICENSE: '1'
          XWIN_ARCH: x86_64
        run: |
          set -euo pipefail
          case "$T" in
            *-linux-gnu) cargo zigbuild --release --locked -p "$CARGO_PKG" --target "$T.2.17" ;;
            *-windows-msvc) cargo xwin build --release --locked -p "$CARGO_PKG" --target "$T" ;;
            *-apple-darwin)
              # cargo-zigbuild gives zig an unversioned macOS target, which links
              # for macOS 13; this cc names the version (cargo-zigbuild#488).
              for c in cc c++; do
                printf '#!/bin/sh\nexec cargo-zigbuild zig %s -- -g -fno-sanitize=all -target %s "$@"\n' "$c" "$ZIG_TARGET" > "$RUNNER_TEMP/bin/zig$c"
                chmod +x "$RUNNER_TEMP/bin/zig$c"
              done
              t=${T//-/_}
              export "CC_$t=$RUNNER_TEMP/bin/zigcc" "CXX_$t=$RUNNER_TEMP/bin/zigc++" "CARGO_TARGET_${t^^}_LINKER=$RUNNER_TEMP/bin/zigcc"
              cargo zigbuild --release --locked -p "$CARGO_PKG" --target "$T" ;;
          esac
          mkdir -p out
          cp "target/$T/release/$BIN" out/
      - name: Check the binary
        env:
          FILE: ${{ matrix.file }}
          MIN: ${{ matrix.min }}
        run: |
          set -euo pipefail
          b="out/$BIN"
          od="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-objdump"
          file "$b"
          file "$b" | grep -Eq "$FILE"
          case "$T" in
            *-linux-gnu)
              glibc=$("$od" -T "$b" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
              echo "needs $glibc"
              test "$(printf '%s\nGLIBC_2.17\n' "$glibc" | sort -V | tail -1)" = GLIBC_2.17 ;;
            *-apple-darwin)
              "$od" --macho --private-headers "$b" > headers.txt
              "$od" --macho --dylibs-used "$b" | tail -n +2 | awk '{print $1}' > dylibs.txt
              cat dylibs.txt
              grep -Eq "(minos|version) $MIN\$" headers.txt
              # Apple silicon runs only signed code; zig signs ad hoc.
              if [ "$T" = aarch64-apple-darwin ]; then grep -q 'cmd LC_CODE_SIGNATURE' headers.txt; fi
              if grep -Ev '^(/usr/lib/|/System/Library/Frameworks/)' dylibs.txt; then echo "::error::links a library macOS does not ship"; exit 1; fi ;;
          esac
          case "$T" in
            x86_64-unknown-linux-gnu) "./$b" version ;;
            *-windows-msvc) WINEPREFIX="$RUNNER_TEMP/wine" WINEDEBUG=-all wine "$b" version ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.key }}
          path: out/${{ inputs.name }}${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 7

  # The only job off our runners (see the header): it takes the built
  # binaries and publishes, nothing else.
  npm:
    needs: [check, build]
    if: needs.check.outputs.publish == 'true' && !inputs.build-only
    runs-on: ${{ inputs.publish-runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env: &release-env
      V: ${{ needs.check.outputs.version }}
      NAME: ${{ inputs.name }}
      PKG: ${{ inputs.npm-package }}
      DIR: ${{ needs.check.outputs.dir }}
      NATIVES: ${{ inputs.natives-dir }}
      ALIASES: ${{ inputs.alias-dirs }}
    steps:
      - &checkout
        uses: actions/checkout@v4
      - &node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Trusted publishing (OIDC) needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1
      # Only the binaries: a re-run also sees other artifacts of the run,
      # such as the Docker build record.
      - &natives
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts
      - &stage
        name: Stage natives
        run: |
          set -euo pipefail
          for d in "$NATIVES"/*/; do
            key=$(basename "$d")
            src=$(find "artifacts/native-$key" -type f | head -1)
            test -s "$src"
            cp "$src" "$d"
            chmod +x "$d"*
          done
          cp README.md LICENSE "$DIR/"
      - name: Publish to npm (trusted publishing)
        run: |
          set -euo pipefail
          pub() {
            local dir=$1 name
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$V" version >/dev/null 2>&1; then echo "= $name@$V already live"; return; fi
            (cd "$dir" && npm publish --access public)
            echo "+ $name@$V"
          }
          for d in "$NATIVES"/*/; do pub "${d%/}"; done
          pub "$DIR"
          for a in $ALIASES; do pub "$a"; done

  release:
    needs: [check, npm]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env: *release-env
    steps:
      - *checkout
      - *node
      - *natives
      - *stage
      - name: Wait for npm to serve the version
        run: |
          set -euo pipefail
          # The registry can take minutes to serve new versions; wait once for all.
          for d in "$NATIVES"/*/ "$DIR" $ALIASES; do
            name=$(node -p "require('./${d%/}/package.json').name")
            for i in $(seq 1 120); do npm view "$name@$V" version >/dev/null 2>&1 && break; sleep 5; done
            npm view "$name@$V" version >/dev/null 2>&1 || { echo "::error::$name@$V not visible after 10 minutes"; exit 1; }
          done
      - name: Smoke the published package
        env:
          SMOKE: ${{ inputs.smoke }}
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          if [ -n "$SMOKE" ]; then bash -euo pipefail -c "$SMOKE"; else npx -y "$PKG@$V" version; fi
      - if: inputs.mcpb
        uses: actions/checkout@v4
        with:
          repository: SylphxAI/mcp-kit
          ref: ${{ inputs.kit-ref }}
          path: .mcp-kit
          sparse-checkout: scripts
      - name: MCP Bundles
        if: inputs.mcpb
        env:
          ICON: ${{ inputs.mcpb-icon }}
        run: |
          set -euo pipefail
          node .mcp-kit/scripts/mcpb.mjs --name "$NAME" --version "$V" --natives "$NATIVES" \
            --package-dir "$DIR" --out assets ${ICON:+--icon "$ICON"} \
            --tools-from "$NATIVES/linux-x64-gnu/$NAME"
          ls -la assets
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v$V" >/dev/null 2>&1; then echo "release v$V exists"; exit 0; fi
          mkdir -p assets
          for d in "$NATIVES"/*/; do
            key=$(basename "$d")
            if [ -f "$d$NAME.exe" ]; then (cd "$d" && zip -q "$GITHUB_WORKSPACE/assets/$NAME-$key.zip" "$NAME.exe")
            else tar -C "$d" -czf "assets/$NAME-$key.tar.gz" "$NAME"; fi
          done
          notes=$(awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md 2>/dev/null || true)
          gh release create "v$V" assets/* --target "$GITHUB_SHA" --title "$NAME $V" --notes "${notes:-$NAME $V}"
      - name: Move the major tag
        if: inputs.major-tag
        run: |
          set -euo pipefail
          git tag -f "v${V%%.*}" "$GITHUB_SHA"
          git push -f origin "refs/tags/v${V%%.*}"
      - name: Publish to the MCP Registry
        env:
          MCP_NAME: ${{ inputs.mcp-name }}
        run: |
          set -euo pipefail
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          enc=$(node -p "encodeURIComponent(process.argv[1])" "$MCP_NAME")
          if curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers/$enc/versions/$V" >/dev/null 2>&1; then
            echo "$MCP_NAME $V already in the registry"
          else
            ./mcp-publisher publish
          fi

  docker:
    needs: [check, build]
    if: inputs.docker-image != ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      V: ${{ needs.check.outputs.version }}
      NAME: ${{ inputs.name }}
      IMAGE: ${{ inputs.docker-image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-linux-*
          path: artifacts
      - name: Stage prebuilt linux binaries
        run: |
          set -euo pipefail
          mkdir -p dist/amd64 dist/arm64
          cp "artifacts/native-linux-x64-gnu/$NAME" dist/amd64/
          cp "artifacts/native-linux-arm64-gnu/$NAME" dist/arm64/
          chmod +x dist/*/"$NAME"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ !inputs.build-only }}
          tags: ${{ env.IMAGE }}:${{ env.V }},${{ env.IMAGE }}:latest
      - name: Read back the image
        if: ${{ !inputs.build-only }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE:$V"
          docker run --rm --entrypoint "$NAME" "$IMAGE:$V" version

  registry-retired:
    if: inputs.retired-mcp-names != '' && !inputs.build-only
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - *node
      - name: Deprecate retired MCP Registry names
        env:
          RETIRED: ${{ inputs.retired-mcp-names }}
          MESSAGE: ${{ inputs.retired-message }}
        run: |
          set -euo pipefail
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          for retired in $RETIRED; do
            enc=$(node -p "encodeURIComponent(process.argv[1])" "$retired")
            url="https://registry.modelcontextprotocol.io/v0.1/servers/$enc/versions/latest"
            deprecated() { curl -fsS "$url" | jq -e '._meta["io.modelcontextprotocol.registry/official"].status == "deprecated"' >/dev/null; }
            if deprecated; then echo "$retired already deprecated"; continue; fi
            ok=false
            for attempt in 1 2 3 4 5; do
              # --yes skips the bulk-operation prompt (no stdin in CI).
              if out=$(./mcp-publisher status --status deprecated --all-versions --yes --message "$MESSAGE" "$retired" 2>&1) \
                 || grep -qE 'already set to the provided values|No changes to apply' <<<"$out"; then ok=true; break; fi
              echo "attempt $attempt: $out"; sleep $((attempt * 15))
            done
            [ "$ok" = true ] || { echo "::error::could not deprecate $retired"; exit 1; }
            for i in $(seq 1 24); do deprecated && break; sleep 5; done
            deprecated || { echo "::error::$retired is still not shown as deprecated"; exit 1; }
          done
