name: publish

# Publishes the crate sylphx-mcp-kit to crates.io when Cargo.toml carries a
# version that is not there yet, then tags vX.Y.Z and moves v0, which the
# servers' release workflows use (`SylphxAI/mcp-kit/.github/workflows/release.yml@v0`).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - id: v
        run: |
          set -euo pipefail
          V=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="sylphx-mcp-kit") | .version')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          present=$(node scripts/release.mjs probe crate sylphx-mcp-kit "$V")
          if [ "$present" = true ]; then echo "publish=false" >> "$GITHUB_OUTPUT"; else echo "publish=true" >> "$GITHUB_OUTPUT"; fi
      - name: Authenticate to crates.io with OIDC
        id: crates-auth
        if: steps.v.outputs.publish == 'true'
        # Trusted publishing: crates.io issues a short-lived token for this
        # exact workflow, repository and environment. The crate already exists
        # on crates.io, so no long-lived token is used or needed — a missing
        # trusted publisher fails loudly instead of falling back.
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish to crates.io
        if: steps.v.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          cargo publish --locked -p sylphx-mcp-kit
          node scripts/release.mjs wait crate sylphx-mcp-kit "$V"
      - name: Tag the release and move v0
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          git fetch -q --tags
          # Only a new version moves the tags; other merges leave v0 alone.
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then echo "v$V is tagged"; exit 0; fi
          git tag "v$V" "$GITHUB_SHA"
          git tag -f "v${V%%.*}" "$GITHUB_SHA"
          git push origin "refs/tags/v$V"
          git push -f origin "refs/tags/v${V%%.*}"
