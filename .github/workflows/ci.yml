name: ci

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'merge_group'
    runs-on: sylphx-linux-standard
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --no-default-features --features embed -- -D warnings
      - run: cargo test --locked --all-features
      # The embedding tokenizer and vectors against model2vec itself.
      - uses: actions/cache@v4
        with:
          path: /tmp/m2v
          key: model2vec-potion-code-16M-v2-${{ hashFiles('crates/mcp-kit/tests/model2vec_expected.py') }}
      - name: Embeddings match model2vec
        run: |
          set -euo pipefail
          d=/tmp/m2v
          if [ ! -f $d/expected.json ]; then
            mkdir -p $d
            rev=e9d2a44ca6a05ac6685f3b23709ea57eb7352d5b
            for f in tokenizer.json model.safetensors config.json; do
              curl -fsSL -o $d/$f "https://huggingface.co/minishlab/potion-code-16M-v2/resolve/$rev/$f"
            done
            python3 -m venv /tmp/venv && /tmp/venv/bin/pip -q install model2vec==0.9.0
            /tmp/venv/bin/python crates/mcp-kit/tests/model2vec_expected.py $d
          fi
          SYLPHX_MODEL_TEST_DIR=$d cargo test --locked --features embed matches_model2vec -- --nocapture
      - name: Launcher runs a platform binary and forwards the exit code
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          mkdir -p "$d/node_modules/@x/tool-linux-x64-gnu" "$d/pkg/bin"
          printf '#!/bin/sh\necho "tool $*"\nexit 3\n' > "$d/node_modules/@x/tool-linux-x64-gnu/tool"
          chmod +x "$d/node_modules/@x/tool-linux-x64-gnu/tool"
          echo '{"name":"@x/tool","bin":{"tool":"bin/tool.js"}}' > "$d/pkg/package.json"
          cp npm/launcher.js "$d/pkg/bin/tool.js"
          set +e; out=$(NODE_PATH="$d/node_modules" node "$d/pkg/bin/tool.js" a b); code=$?; set -e
          test "$out" = "tool a b" && test "$code" = 3
      - name: MCP Bundles build, validate and run
        run: node --test scripts/mcpb.test.mjs

  plain-language:
    if: github.event_name != 'merge_group'
    runs-on: sylphx-linux-standard
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: SylphxAI/.github/.github/actions/plain-language@f9176dad2e49c6b99d75f1506fafac84632fe870

  # macOS on our macOS pool. Windows, which we do not host: the tests are
  # cross-compiled to MSVC on Linux and run under wine.
  macos:
    if: github.event_name != 'merge_group'
    name: test macos
    runs-on: [self-hosted, sylphx, macos, standard]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --locked --all-features

  windows:
    if: github.event_name != 'merge_group'
    name: test windows (wine)
    runs-on: sylphx-linux-standard
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-pc-windows-msvc
          components: llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: windows
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-0.23.1-x86_64
      - name: cargo-xwin, clang and wine
        run: |
          set -euo pipefail
          fetch() { curl -fsSL -o "$RUNNER_TEMP/$2" "$1"; echo "$3  $RUNNER_TEMP/$2" | sha256sum -c -; }
          fetch https://github.com/rust-cross/cargo-xwin/releases/download/v0.23.1/cargo-xwin-v0.23.1.x86_64-unknown-linux-musl.tar.gz xwin.tgz \
            c492c6dfb7e5ac0eee586b796e0fc950ba13077e7f0bbb046f445d71790d5360
          # Ubuntu 24.04's wine 9.0 aborts in our runner VMs; this 64-bit build runs.
          fetch https://github.com/Kron4ek/Wine-Builds/releases/download/11.18/wine-11.18-amd64-wow64.tar.xz wine.txz \
            f899879b8c37e0b20adca19d147cf77436f3f1a37bf16d08d27fa7137a52b9ba
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf "$RUNNER_TEMP/xwin.tgz" -C "$RUNNER_TEMP/bin" cargo-xwin
          tar -xJf "$RUNNER_TEMP/wine.txz" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/bin" "$RUNNER_TEMP/wine-11.18-amd64-wow64/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends clang >/dev/null
      - run: cargo xwin test --locked --all-features --target x86_64-pc-windows-msvc
        env:
          XWIN_ACCEPT_LICENSE: '1'
          XWIN_ARCH: x86_64
          WINEPREFIX: ${{ runner.temp }}/wine
          WINEDEBUG: -all

  ci:
    if: always()
    needs: [test, plain-language, macos, windows]
    runs-on: sylphx-linux-standard
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do case "$r" in success|skipped) ;; *) exit 1 ;; esac; done
